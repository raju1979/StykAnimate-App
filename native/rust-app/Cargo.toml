[package]
name = "stykanimate-rust-preview"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
image = { version = "=0.25.5", default-features = false, features = ["png"] }
gif = "=0.13.1"
base64 = "=0.22.1"
tempfile = "=3.19.1"
rfd = "=0.15.3"

[profile.release]
opt-level = 3
lto = "thin"

[[bin]]
name = "stykanimate-rust-preview"
path = "src/main.rs"
